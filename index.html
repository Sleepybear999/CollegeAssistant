<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NITJ Assistant</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c1e21; --muted:#6b7280; --accent:#2563eb; --user:#2563eb; --border:#e5e7eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111317; --card:#1b1e24; --text:#e8eaed; --muted:#9aa0a6; --accent:#60a5fa; --user:#2563eb; --border:#2c3038; }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); display:flex; flex-direction:column; }
  header { padding:14px 16px; border-bottom:1px solid var(--border); background:var(--card); font-weight:600; }
  #chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; max-width:760px; width:100%; margin:0 auto; }
  .msg { padding:10px 14px; border-radius:14px; max-width:88%; line-height:1.5; white-space:pre-wrap; word-wrap:break-word; }
  .user { align-self:flex-end; background:var(--user); color:#fff; border-bottom-right-radius:4px; }
  .bot { align-self:flex-start; background:var(--card); border:1px solid var(--border); border-bottom-left-radius:4px; }
  .src { margin-top:8px; font-size:12px; color:var(--muted); }
  .src a { color:var(--accent); text-decoration:none; }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--border); background:var(--card); max-width:760px; width:100%; margin:0 auto; }
  input { flex:1; padding:12px 14px; font-size:16px; border:1px solid var(--border); border-radius:10px; background:var(--bg); color:var(--text); outline:none; }
  button { padding:0 18px; font-size:16px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-weight:600; }
  button:disabled { opacity:.5; }
  .hint { color:var(--muted); text-align:center; margin-top:30px; font-size:14px; }
</style>
</head>
<body>
<header>NITJ Assistant</header>
<div id="chat"><div class="hint">Ask anything about NIT Jalandhar.</div></div>
<form id="f">
  <input id="q" placeholder="Type your question..." autocomplete="off" required>
  <button id="b">Ask</button>
</form>
<script>
const chat = document.getElementById("chat"), f = document.getElementById("f"),
      q = document.getElementById("q"), b = document.getElementById("b");

function add(cls, text) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

f.addEventListener("submit", async (e) => {
  e.preventDefault();
  const question = q.value.trim();
  if (!question) return;
  chat.querySelector(".hint")?.remove();
  add("user", question);
  q.value = ""; b.disabled = true;
  const bot = add("bot", "Thinking...");
  try {
    const r = await fetch("/ask", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({question}) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "Request failed");
    bot.textContent = data.answer;
    const links = (data.sources || []).filter(s => s.url);
    if (links.length) {
      const s = document.createElement("div");
      s.className = "src";
      s.append("Sources: ");
      links.slice(0, 3).forEach((x, i) => {
        if (i) s.append(" · ");
        const a = document.createElement("a");
        a.href = x.url; a.target = "_blank"; a.rel = "noopener";
        a.textContent = x.title || x.url;
        s.append(a);
      });
      bot.appendChild(s);
    }
  } catch (err) {
    bot.textContent = "Error: " + err.message + ". If the server was asleep, wait a minute and try again.";
  }
  b.disabled = false; q.focus();
  chat.scrollTop = chat.scrollHeight;
});
</script>
</body>
</html>
